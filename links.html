    <header class="reverse">

                    <h1>Find HATEKID Everywhere</h1>
                    <p class="links-intro">Use these placeholders for now, then swap each URL with your real profile links.</p>

                        <span class="node-label">Spotify</span>
                        <span class="node-handle">Artist Placeholder</span>
                    </a>

                    <a class="social-node social-node--tt" href="https://tiktok.com/@yourprofile" target="_blank" rel="noopener noreferrer" aria-label="TikTok placeholder link">
                        <span class="node-icon"><i class="fab fa-tiktok"></i></span>
                        <span class="node-label">TikTok</span>
                        <span class="node-handle">@yourprofile</span>
                    </a>

                    <a class="social-node social-node--x" href="https://x.com/yourprofile" target="_blank" rel="noopener noreferrer" aria-label="X placeholder link">

                        <span class="node-label">X</span>
